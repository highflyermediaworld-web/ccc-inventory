services:
  - type: web
    name: ccc-inventory
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # AI scanner / estimates: set ONE of these (first configured wins:
      # Gemini → OpenAI → Anthropic). Override with AI_PROVIDER if needed.
      - key: GEMINI_API_KEY
        sync: false
      # Optional: Instagram → shows sync. Usually pasted in Admin → Shop
      # settings instead; set here only if you prefer env-managed tokens.
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: IG_SHOWS_INTERVAL_MIN
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # First-boot logins (seeded once; manage afterwards in Admin → Team & logins)
      - key: ADMIN_INITIAL_USERNAME
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: IT_INITIAL_USERNAME
        sync: false
      - key: IT_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: AUTO_IMPORT_URL
        sync: false
      - key: AUTO_IMPORT_INTERVAL_MIN
        value: "30"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
