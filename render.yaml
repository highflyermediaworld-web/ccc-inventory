services:
  - type: web
    name: ccc-inventory
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: Cpullscards
      - key: ADMIN_PASSWORD
        value: cpulls2026
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: AUTO_IMPORT_URL
        value: https://docs.google.com/spreadsheets/d/1o01iG3cIHHTlHwCER2G1RmOCGN6LcYYuvFJ14RUkzB4/edit?usp=drivesdk
      - key: AUTO_IMPORT_INTERVAL_MIN
        value: "30"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
